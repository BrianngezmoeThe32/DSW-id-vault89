<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Branch</title>
    <link rel="stylesheet" href="branch.css">
</head>
<body>
    <div class="form-container">
        <h2>Find a Branch</h2>
        <form id="branch-form">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Enter City" required>

            <label for="postal-code">Postal Code</label>
            <input type="text" id="postal-code" name="postal-code" placeholder="Enter Postal Code" pattern="[0-9]{5}" required>

            <label for="branch-name">Branch Name (optional)</label>
            <input type="text" id="branch-name" name="branch-name" placeholder="Enter Branch Name">

            <button type="submit">Search</button>
        </form>

        <div id="results"></div>
    </div>

</body>
</html>
