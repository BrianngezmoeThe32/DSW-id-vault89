<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search | IdVault</title>
    <link rel="stylesheet" href="../home/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Navbar -->
      <nav class="navbar">
        <div class="logo">IdVault |</div>
        <ul>
          <li><a href="../police/index.html">Police Forum</a></li>
          <li><a href="../Local/index.html">Local Certifications</a></li>
          <li><a href="../Home-Affair/index.html">Home Affairs</a></li>
        </ul>
        <div class="user-actions">
          <i class="fa-solid fa-arrow-left"></i
          ><a href="../home/index.html">Back</a>
        </div>
      </nav>

      <!-- Banner -->
      <main class="banner">
        <div class="banner-text">
          <h1>Search Everything</h1>
          <p>Find any information available in IdVault or ask ChatGPT.</p>
        </div>
      </main>

      <!-- Search Box -->
      <section class="info">
        <input
          type="text"
          id="searchInput"
          placeholder="Search for services, documents, or help..."
          style="width: 60%; padding: 12px; font-size: 16px"
        />
        <br /><br />
        <button onclick="performSearch()" class="info-button">Search</button>
        <br /><br />
        <div id="searchResults" style="padding: 20px; text-align: left"></div>
      </section>

      <!-- Footer (Same as homepage) -->
      <footer class="site-footer">
        <div class="footer-links">
          <a href="#">Terms Of Use</a> | <a href="#">Idvault Regulations</a> |
          <a href="#">Privacy Statement</a> |
          <a href="#">Security Centre</a>
        </div>
        <p class="footer-text">
          © Idvault Limited, Reg 2025/03/06. All rights reserved.
        </p>
      </footer>
    </div>

    <script>
      const localData = [
        {
          title: "Virtual Cards",
          content:
            "You can view and manage your virtual cards under the Virtual Cards tab.",
        },
        {
          title: "Documents",
          content:
            "Access and manage all your important documents in the Documents section.",
        },
        {
          title: "Account Settings",
          content:
            "Update your personal details, security, and privacy preferences.",
        },
        {
          title: "Police Forum",
          content: "Report issues and collaborate with police services.",
        },
        {
          title: "Local Certifications",
          content: "Verify and apply for local certificates online.",
        },
        {
          title: "Home Affairs",
          content: "Check ID, passport, and other vital registrations.",
        },
      ];

      async function performSearch() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const resultsDiv = document.getElementById("searchResults");
        resultsDiv.innerHTML = "Searching...";

        // Check in local content
        const results = localData.filter(
          (item) =>
            item.title.toLowerCase().includes(query) ||
            item.content.toLowerCase().includes(query)
        );

        if (results.length > 0) {
          resultsDiv.innerHTML = results
            .map((r) => `<h3>${r.title}</h3><p>${r.content}</p><hr>`)
            .join("");
        } else {
          
          resultsDiv.innerHTML =
            "<p>No internal info found. Asking Vault Ai...</p>";

          const chatGptResponse = await fetchFromChatGPT(query);
          resultsDiv.innerHTML = `<p><strong>AI Answer:</strong><br>${chatGptResponse}</p>`;
        }
      }

      async function fetchFromChatGPT(query) {
        try {
          const response = await fetch(
            "https://api.openai.com/v1/chat/completions",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "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", // <-- Replace this!
              },
              body: JSON.stringify({
                model: "gpt-3.5-turbo",
                messages: [{ role: "user", content: query }],
              }),
            }
          );

          const data = await response.json();
          return data.choices[0].message.content;
        } catch (err) {
          return "Sorry, I couldn't fetch info from Vault Ai";
        }
      }
    </script>
  </body>
</html>
