<!DOCTYPE html>

  </head>
  <body>
    <div class="top-bar">Welcome to the Certificate Upload Page</div>

    <div class="navbar">
      <div class="logo">Idvault</div>
      <ul>G
        <li><a href="#">Home</a></li>

    <div class="submenu">
      <a href="#">Upload Certificate</a>

    <div class="info">
      <h1>Upload Your Certificate</h1>
      <p>Please select a PDF or image file to certify your document</p>

      <form action="upload.php" method="POST" enctype="multipart/form-data">
        <input
          type="file"
          name="certificate"
          accept=".pdf,.jpg,.jpeg,.png"
          required
        /><br /><br />
        <button class="info-button" type="submit">Upload Certificate</button>
      </form>
      <p id="uploadMessage"></p>
    </div>

    <div class="footer">
      <div>
        <h3>Support</h3>

    <div class="site-footer">
      <div class="footer-text">UJ Document Certification Portal</div>
      <div class="footer-border"></div>
    </div>
  </body>
</html>
