<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Settings</title>
  <link rel="stylesheet" href="../home/style.css" />
  <style>
    .settings-container {
      max-width: 600px;
      margin: 50px auto;
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .settings-container h1 {
      text-align: center;
      color: #ff5733;
      margin-bottom: 30px;
    }
    .settings-form label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      color: black;
    }
    .settings-form input[type="text"],
    .settings-form input[type="email"],
    .settings-form input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
      font-size: 1em;
    }
    .settings-form button {
      width: 100%;
      padding: 12px;
      background-color: rgb(255, 18, 18);
      color: white;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .settings-form button:hover {
      background-color: #c30000;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">DSW</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Dashboard</a></li>
      <li><a href="#">Logout</a></li>
    </ul>
  </div>

  <div class="submenu">
    <a href="#">Account Settings</a>
    <a href="#">Security</a>
    <a href="#">Notifications</a>
  </div>

  <div class="settings-container">
    <h1>Account Settings</h1>
    <form class="settings-form" id="settingsForm" method="POST">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" placeholder="Enter new username" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter new email" required />

      <label for="password">New Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter new password" required />

      <label for="confirm-password">Confirm Password:</label>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm new password" required />

      <button type="submit">Save Changes</button>
    </form>
  </div>

  <script>
    document.getElementById('settingsForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new FormData(this);

      fetch('save-settings.php', {
        method: 'POST',
        body: formData
      })
      .then(res => res.text())
      .then(data => {
        alert(data);  // Show message returned from PHP
        document.getElementById('settingsForm').reset();
      })
      .catch(err => {
        alert("Error submitting settings: " + err);
      });
    });
  </script>

</body>
</html>
