<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDVAULT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main">
        <div class="box">
            <div class="title">
                <h1>IDVAULT</h1>
            </div>
            
            <div class="form" id="signup">
                <h2>Create Account</h2>
                <form>
                    <div class="input">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Full Name" required>
                    </div>
                    <div class="input">
                        <i class="fas fa-id-card"></i>
                        <input type="text" placeholder="ID Number" required>
                    </div>
                    <div class="input">
                        <i class="fas fa-graduation-cap"></i>
                        <input type="text" placeholder="Student Number" required>
                    </div>
                    <div class="input">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    <div class="input">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Confirm Password" required>
                    </div>
                    <div class="upload">
                        <div class="options">
                            <label for="id-picture" class="option">
                                <i class="fas fa-file-upload"></i>
                                <span>Upload ID Picture</span>
                                <input type="file" id="id-picture" accept="image/*" capture="environment">
                            </label>
                            <button type="button" id="camera-capture" class="option">
                                <i class="fas fa-camera"></i>
                                <span>Take Photo</span>
                            </button>
                        </div>
                        <div class="preview" id="preview-container">
                            <img id="preview" src="#" alt="Preview" style="display: none;">
                            <video id="camera-stream" style="display: none;" autoplay playsinline></video>
                            <canvas id="capture-canvas" style="display: none;"></canvas>
                            <div class="camera" style="display: none;">
                                <button type="button" id="capture-button" class="btn-camera">
                                    <i class="fas fa-camera"></i>
                                </button>
                                <button type="button" id="retake-button" class="btn-camera" style="display: none;">
                                    <i class="fas fa-redo"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn">Sign Up</button>
                </form>
                <p class="link">Already have an account? <a href="#" id="show-login">Login</a></p>
            </div>

            <div class="form" id="login" style="display: none;">
                <h2>Welcome Back</h2>
                <form>
                    <div class="input">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    <div class="check">
                        <label>
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
                <p class="link">Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
